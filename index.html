<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="md-app-bar">
    <span class="md-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pokeball">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
        <path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
        <path d="M3 12h6" />
        <path d="M15 12h6" />
      </svg>
    </span>
    <h1 class="md-title">Pokédex</h1>
    <div class="spacer"></div>
    <span id="count"></span>
  </header>

  <main class="md-container">
    <h2 class="md-header">Pokémon</h2>
    <div class="md-grid">
      <!-- Ivysaur -->
      <div id="P5N972" class="md-card uncaught">
        <img src="assets/images/P5N972.png">
      </div>

      <!-- Charizard -->
      <div id="P79XL5" class="md-card uncaught">
        <img src="assets/images/P79XL5.png">
      </div>

      <!-- Squirtle -->
       <div id="P19M2K" class="md-card uncaught">
        <img src="assets/images/P19M2K.png">
      </div>

      <!-- Pikachu -->
      <div id="P66IJ2" class="md-card uncaught">
        <img src="assets/images/P66IJ2.png">
      </div>

      <!-- Machoke -->
      <div id="P5Y42Q" class="md-card uncaught">
        <img src="assets/images/P5Y42Q.png">
      </div>

      <!-- Exeggutor -->
      <div id="P7HYNK" class="md-card uncaught">
        <img src="assets/images/P7HYNK.png">
      </div>

      <!-- Ditto -->
       <div id="P3QQG4" class="md-card uncaught">
        <img src="assets/images/P3QQG4.png">
      </div>

      <!-- Vaporeon -->
      <div id="P1B7YP" class="md-card uncaught">
        <img src="assets/images/P1B7YP.png">
      </div>

      <!-- Bellosom -->
      <div id="P10A3L" class="md-card uncaught">
        <img src="assets/images/P10A3L.png">
      </div>

      <!-- Groudon -->
      <div id="P5HO2M" class="md-card uncaught">
        <img src="assets/images/P5HO2M.png">
      </div>
    </div>

    <div class="vertical-spacer"></div>

    <h2 class="md-header">Trainers</h2>
    <div class="md-grid">
      <!-- Misty -->
      <div id="T48HQ3" class="md-card uncaught">
        <img src="assets/images/T48HQ3.png">
      </div>

      <!-- Lt. Surge -->
      <div id="T895GO" class="md-card uncaught">
        <img src="assets/images/T895GO.png">
      </div>

      <!-- Team Rocket -->
      <div id="TCSTRP" class="md-card uncaught">
        <img src="assets/images/TCSTRP.png">
      </div>

      <!-- Ash Ketchum -->
      <div id="T2JRD4" class="md-card uncaught">
        <img src="assets/images/T2JRD4.png">
      </div>

      <!-- May -->
       <div id="T30IMX" class="md-card uncaught">
        <img src="assets/images/T30IMX.png">
      </div>

      <!-- Team Aqua -->
      <div id="T942HN" class="md-card uncaught">
        <img src="assets/images/T942HN.png">
      </div>
    </div>
  </main>
  
  <div id="mdModal" class="md-modal-backdrop" onclick="toggleModal(false)">
    <div class="md-modal-card" onclick="event.stopPropagation()">
      <div class="md-modal-actions">
        <button class="md-modal-btn" onclick="toggleModal(false)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M18 6l-12 12" />
            <path d="M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="md-modal-content">
        <img id="mdModalImage">
      </div>
      <h2 id="mdModalTitle" class="md-modal-title"></h2>
    </div>
  </div>

  <script src="assets/js/script.js"></script>
</body>
</html>
